services:
  - type: web
    name: drophub-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://allydigitalpartners.com
      - key: DATABASE_URL
        fromDatabase:
          name: drophub-db
          property: connectionString

databases:
  - name: drophub-db
    plan: free
    region: oregon
